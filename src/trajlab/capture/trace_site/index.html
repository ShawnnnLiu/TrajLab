<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TrajLab trace</title>
<link rel="stylesheet" href="/static/app.css">
<script src="/static/app.js" defer></script>
</head>
<body>
<header id="topbar">
  <a class="brand" href="#/">TrajLab trace</a>
  <nav id="crumbs" aria-label="Breadcrumb"></nav>
  <div class="spacer"></div>
  <label class="hints-toggle" id="hints-toggle" hidden title="Hints are cross-references that resemble the detector's rules. Turning them on marks this trial's labels as not blind (ADR-0015 §8).">
    <input type="checkbox" id="hints"> Hints
  </label>
  <label class="labeler">Labeler <input id="labeler" type="text" placeholder="your name" maxlength="40" autocomplete="off" spellcheck="false"></label>
  <span id="save-status" class="save-status" aria-live="polite"></span>
</header>
<main id="view"><p class="loading">Loading…</p></main>
</body>
