[project]
name = "trajlab"
version = "0.1.0"
description = "Capture harness: Claude Code on Terminal-Bench via Harbor, with per-tool-call environment checkpoints"
authors = [
    { name = "Shawn Liu", email = "xiangjl4@uci.edu" }
]
requires-python = ">=3.12"
dependencies = [
    "harbor==0.23.0",
    "pydantic>=2.13.5",
    "typer>=0.27.2",
    "watchdog>=6.0.0",
]

[project.scripts]
trajlab = "trajlab.cli:app"

[build-system]
requires = ["uv_build>=0.11.10,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
